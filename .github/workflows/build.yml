name: Compilar plugin (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -S . -B build -A x64

      - name: Compilar
        run: cmake --build build --config Release --parallel --target Sampler5_VST3 Sampler5_Standalone EngineTests

      - name: Pruebas del motor
        run: ctest --test-dir build -C Release -R EngineTests --output-on-failure

      - name: Subir VST3
        uses: actions/upload-artifact@v4
        with:
          name: Sampler5-VST3-Windows
          path: build/Sampler5_artefacts/Release/VST3/

      - name: Subir version standalone
        uses: actions/upload-artifact@v4
        with:
          name: Sampler5-Standalone-Windows
          path: build/Sampler5_artefacts/Release/Standalone/*.exe
